<!DOCTYPE html>
<html>
<head>
    <title>Participants</title>
</head>
<body>

<h1>Participants</h1>

<hr>

<a href="{{ url_for('staff_dashboard') }}">Dashboard</a> |
<a href="{{ url_for('my_treks') }}">My Treks</a> |
<a href="{{ url_for('participants') }}">Participants</a> |
<a href="{{ url_for('staff_profile') }}">Profile</a> |
<a href="{{ url_for('logout') }}">Logout</a>

<hr>

<table border="1" cellpadding="8">

<tr>
    <th>Trek</th>
    <th>Trekker</th>
    <th>Phone</th>
    <th>Booking Date</th>
    <th>Status</th>
</tr>

{% for participant in participants %}

<tr>

    <td>{{ participant[0] }}</td>
    <td>{{ participant[1] }}</td>
    <td>{{ participant[2] }}</td>
    <td>{{ participant[3] }}</td>
    <td>{{ participant[4] }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
