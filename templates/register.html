<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    Trekking Management System
</header>

<div class="container">

    <form action="{{ url_for('register') }}" method="POST">

        <h1 style="text-align:center; margin-bottom:25px;">Register</h1>

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Phone Number</label>
        <input type="tel" name="phone" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>

        <label>Role</label>

        <div style="margin:12px 0 20px 0;">
            <input type="radio" id="trekker" name="role" value="trekker" checked style="width:auto;">
            <label for="trekker">Trekker</label>

            &nbsp;&nbsp;&nbsp;

            <input type="radio" id="staff" name="role" value="staff" style="width:auto;">
            <label for="staff">Trek Staff</label>
        </div>

        <div class="form-buttons">
            <button type="submit" class="btn btn-primary">
                Register
            </button>
        </div>

        <p style="text-align:center; margin-top:25px;">
            Already have an account?
            <a href="{{ url_for('login') }}">Login</a>
        </p>

    </form>

</div>

</body>
</html>
