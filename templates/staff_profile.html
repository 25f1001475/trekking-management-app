<!DOCTYPE html>
<html>
<head>
    <title>Staff Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    Trekking Management System
</header>

<div class="container">

    <h1>My Profile</h1>

    <nav>
        <a href="{{ url_for('staff_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('my_treks') }}">My Treks</a>
        <a href="{{ url_for('participants') }}">Participants</a>
        <a href="{{ url_for('staff_profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </nav>

    <div class="card">

        <form method="POST">

            <label>Name</label>
            <input
                type="text"
                name="name"
                value="{{ staff[0] }}"
                required
            >

            <label>Email</label>
            <input
                type="email"
                value="{{ staff[1] }}"
                readonly
            >

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                value="{{ staff[2] }}"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                value="{{ staff[3] }}"
                required
            >

            <div class="form-buttons">

                <button type="submit" class="btn btn-warning">
                    Update Profile
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
