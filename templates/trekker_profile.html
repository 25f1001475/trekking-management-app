<!DOCTYPE html>
<html>
<head>
    <title>Trekker Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    Trekking Management System
</header>

<div class="container">

    <h1>My Profile</h1>

    <nav>
        <a href="{{ url_for('trekker_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('browse_treks') }}">Browse Treks</a>
        <a href="{{ url_for('my_bookings') }}">My Bookings</a>
        <a href="{{ url_for('trek_history') }}">History</a>
        <a href="{{ url_for('trekker_profile') }}">Profile</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </nav>

    <div class="card">

        <form method="POST">

            <label>Name</label>
            <input
                type="text"
                name="name"
                value="{{ user[0] }}"
                required
            >

            <label>Email</label>
            <input
                type="email"
                value="{{ user[1] }}"
                readonly
            >

            <label>Phone</label>
            <input
                type="text"
                name="phone"
                value="{{ user[2] }}"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                value="{{ user[3] }}"
                required
            >

            <div class="form-buttons">

                <button type="submit" class="btn btn-warning">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
