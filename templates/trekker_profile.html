<!DOCTYPE html>
<html>
<head>
    <title>Trekker Profile</title>
</head>
<body>

<h1>Trekker Profile</h1>

<hr>

<a href="{{ url_for('trekker_dashboard') }}">Dashboard</a> |
<a href="{{ url_for('browse_treks') }}">Browse Treks</a> |
<a href="{{ url_for('my_bookings') }}">My Bookings</a> |
<a href="{{ url_for('trek_history') }}">History</a> |
<a href="{{ url_for('trekker_profile') }}">Profile</a> |
<a href="{{ url_for('logout') }}">Logout</a>

<hr>

<form method="POST">

<label>Name</label><br>
<input
    type="text"
    name="name"
    value="{{ user[0] }}"
    required
><br><br>

<label>Email</label><br>
<input
    type="email"
    value="{{ user[1] }}"
    readonly
><br><br>

<label>Phone</label><br>
<input
    type="text"
    name="phone"
    value="{{ user[2] }}"
    required
><br><br>

<label>Password</label><br>
<input
    type="text"
    name="password"
    value="{{ user[3] }}"
    required
><br><br>

<button type="submit">
    Save Changes
</button>

</form>

</body>
</html>
