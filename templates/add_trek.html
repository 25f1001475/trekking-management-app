<!DOCTYPE html>
<html>
<head>
    <title>{{ "Edit Trek" if trek else "Add Trek" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
    Trekking Management System
</header>

<div class="container">

    <h1>{{ "Edit Trek" if trek else "Add Trek" }}</h1>

    <nav>
        <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
        <a href="{{ url_for('manage_treks') }}">Manage Treks</a>
        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
    </nav>

    <form method="POST">

        <label>Trek Name</label>
        <input type="text" name="trek_name" value="{{ trek[1] if trek else '' }}" required>

        <label>Location</label>
        <input type="text" name="location" value="{{ trek[2] if trek else '' }}" required>

        <label>Difficulty</label>
        <select name="difficulty">
            <option value="Easy" {% if trek and trek[3]=="Easy" %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek and trek[3]=="Moderate" %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek and trek[3]=="Hard" %}selected{% endif %}>Hard</option>
        </select>

        <label>Duration (Days)</label>
        <input type="number" name="duration" value="{{ trek[4] if trek else '' }}" required>

        <label>Start Date</label>
        <input type="date" name="start_date" value="{{ trek[5] if trek else '' }}" required>

        <label>End Date</label>
        <input type="date" name="end_date" value="{{ trek[6] if trek else '' }}" required>

        <label>Available Slots</label>
        <input type="number" name="available_slots" value="{{ trek[7] if trek else '' }}" required>

        <label>Assign Staff</label>

        <select name="assigned_staff">

            <option value="">-- Select Staff --</option>

            {% for member in staff %}

            <option value="{{ member[0] }}"
                {% if trek and trek[8] == member[0] %}selected{% endif %}>
                {{ member[1] }}
            </option>

            {% endfor %}

        </select>

        <label>Status</label>

        <select name="status">

            <option value="Open"
                {% if trek and trek[9] == "Open" %}selected{% endif %}>
                Open
            </option>

            <option value="Closed"
                {% if trek and trek[9] == "Closed" %}selected{% endif %}>
                Closed
            </option>

        </select>

        <label>Description</label>
        <textarea name="description">{{ trek[10] if trek else '' }}</textarea>

        <div class="form-buttons">

            {% if trek %}

            <button type="submit" class="btn btn-warning">
                Update Trek
            </button>

            {% else %}

            <button type="submit" class="btn btn-success">
                Add Trek
            </button>

            {% endif %}

        </div>

    </form>

</div>

</body>
</html>
